name: sabpaisa_flutter
description: Flutter plugin for SabPaisa SDK. To know more about SabPaisa, visit http://sabpaisa.in.
version: 1.1.0
homepage: https://gitlab.com/eywa-public/sabpaisaplugins2025/sabpaisa-flutter-plugin

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=2.0.0"

dependencies:
  flutter:
    sdk: flutter
  eventify: ^1.0.0
  fluttertoast: ^8.0.7
  package_info_plus: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.16.5

# iOS is intentionally not declared: the SabPaisa native SDK breaks the iOS
# build (SabPaisaPod/Alamofire), and payments on iOS go through IAP instead.
flutter:
  plugin:
    platforms:
      android:
        package: com.sabpaisa.sabpaisa_flutter
        pluginClass: SabPaisaFlutterPlugin
