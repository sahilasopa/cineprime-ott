<script>
  function openRazorpayCheckout(optionsJson) {
    const options = JSON.parse(optionsJson);
    options.handler = function (response) {
      if (window.flutterRazorpayCallback) {
        window.flutterRazorpayCallback(JSON.stringify(response));
      }
    };
    const rzp = new Razorpay(options);
    rzp.open();
  }
</script>
